name: Frontend CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out backend API contract
        uses: actions/checkout@v4
        with:
          repository: tlavu2004/moodly-backend
          path: moodly-backend
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify generated API client
        run: npm run generate:api && git diff --exit-code -- src/api/openapi
        env:
          OPENAPI_INPUT: moodly-backend/docs/api/json/moodly-openapi.json
      - run: npm run test:build-config
      - run: npm run lint
      - run: npm run build
      - run: npm run test:run
      - run: npm run test:coverage
      - run: npm audit --audit-level=high

  container:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build container with synthetic browser configuration
        run: >-
          docker build -t moodly-frontend:ci .
          --build-arg DEPLOY_ENV=test
          --build-arg SOURCE_REVISION=${{ github.sha }}
          --build-arg IMAGE_VERSION=test-${{ github.sha }}
          --build-arg VITE_AUTH0_DOMAIN=example.auth0.com
          --build-arg VITE_AUTH0_CLIENT_ID=ci-public-client
          --build-arg VITE_AUTH0_AUDIENCE=https://api.example.com
          --build-arg VITE_API_BASE_URL=https://api.example.com
      - name: Record container identity
        run: node scripts/record-image.mjs moodly-frontend:ci
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-container-identity
          path: reports/container-image.json
          retention-days: 14
      - name: Start container
        run: >-
          docker run -d --name moodly-frontend-ci
          --read-only --tmpfs /tmp --cap-drop ALL
          --security-opt no-new-privileges:true
          -p 127.0.0.1:4173:8080 moodly-frontend:ci
      - name: Verify container readiness and static serving
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/healthz; then break; fi
            sleep 1
          done
          node scripts/container-smoke.mjs http://127.0.0.1:4173 moodly-frontend-ci
      - name: Container diagnostics
        if: failure()
        run: docker logs moodly-frontend-ci
      - name: Remove container
        if: always()
        run: docker rm -f moodly-frontend-ci || true

  e2e-test:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
          E2E_DATA_RESET_URL: ${{ vars.E2E_DATA_RESET_URL }}
          E2E_DATA_RESET_TOKEN: ${{ secrets.E2E_DATA_RESET_TOKEN }}
          E2E_TEST_USER_EMAIL: ${{ secrets.E2E_TEST_USER_EMAIL }}
          E2E_TEST_USER_PASSWORD: ${{ secrets.E2E_TEST_USER_PASSWORD }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_AUTH0_AUDIENCE: ${{ vars.VITE_AUTH0_AUDIENCE }}
          VITE_AUTH0_CLIENT_ID: ${{ vars.VITE_AUTH0_CLIENT_ID }}
          VITE_AUTH0_DOMAIN: ${{ vars.VITE_AUTH0_DOMAIN }}
