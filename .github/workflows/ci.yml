name: Frontend CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: ${{ (github.event_name == 'pull_request' || github.ref == 'refs/heads/main') && '0' || '1' }}
      - name: Check out backend API contract
        uses: actions/checkout@v7
        with:
          repository: tlavu2004/moodly-backend
          ref: 4f026c7cb836e1bb10e5734e2745a4db116a09cb
          path: moodly-backend
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify generated API client
        run: npm run verify:api
        env:
          OPENAPI_INPUT: moodly-backend/docs/api/json/moodly-openapi.json
      - run: npm run test:build-config
      - run: npm run lint
      - run: npm run build
      - run: npm run test:run
      - run: npm run test:coverage
      - name: Summarize changed-line coverage
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        continue-on-error: true
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node --experimental-strip-types scripts/summarize-patch-coverage.ts
      - name: Analyze with SonarQube Cloud
        if: >-
          ${{ success() && env.SONAR_TOKEN != '' &&
              vars.SONAR_ORGANIZATION != '' && vars.SONAR_PROJECT_KEY != '' &&
              ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
               (github.event_name == 'push' && github.ref == 'refs/heads/main')) }}
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@70bad232163b09d998ea0707ee80c0ec80798c16 # v8.5.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >-
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
      - name: Upload coverage to Codecov
        if: >-
          ${{ success() && env.CODECOV_TOKEN != '' &&
              ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
               (github.event_name == 'push' && github.ref == 'refs/heads/main')) }}
        continue-on-error: true
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: coverage/lcov.info
          disable_search: true
      - run: npx playwright install --with-deps chromium
      - name: Public E2E on owned Vite test server
        run: npx playwright test --project=public
        env:
          MOODLY_ENV_SOURCE: process
          VITE_AUTH0_DOMAIN: example.auth0.com
          VITE_AUTH0_CLIENT_ID: ci-public-client
          VITE_AUTH0_AUDIENCE: https://api.example.com
          VITE_API_BASE_URL: https://api.example.com
      - run: npm audit --audit-level=high

  container:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build container with synthetic browser configuration
        run: >-
          docker build -t moodly-frontend:ci .
          --build-arg DEPLOY_ENV=test
          --build-arg SOURCE_REVISION=${{ github.sha }}
          --build-arg IMAGE_VERSION=test-${{ github.sha }}
          --build-arg VITE_AUTH0_DOMAIN=example.auth0.com
          --build-arg VITE_AUTH0_CLIENT_ID=ci-public-client
          --build-arg VITE_AUTH0_AUDIENCE=https://api.example.com
          --build-arg VITE_API_BASE_URL=https://api.example.com
      - name: Record container identity
        run: node scripts/record-image.mjs moodly-frontend:ci
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-container-identity
          path: reports/container-image.json
          retention-days: 14
      - name: Start container
        run: >-
          docker run -d --name moodly-frontend-ci
          --read-only --tmpfs /tmp --cap-drop ALL
          --security-opt no-new-privileges:true
          -p 127.0.0.1:5173:8080 moodly-frontend:ci
      - name: Verify container readiness and static serving
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5173/healthz; then break; fi
            if [ "$attempt" -eq 30 ]; then
              echo "::error::Frontend container did not become ready within 30 attempts."
              exit 1
            fi
            sleep 1
          done
          node scripts/container-smoke.mjs http://127.0.0.1:5173 moodly-frontend-ci
        env:
          EXPECTED_BROWSER_API_URL: https://api.example.com
      - name: Public E2E on actual Nginx image
        run: npx playwright test --project=public
        env:
          MOODLY_ENV_SOURCE: process
          E2E_TARGET: container
          VITE_AUTH0_DOMAIN: example.auth0.com
          VITE_AUTH0_CLIENT_ID: ci-public-client
          VITE_AUTH0_AUDIENCE: https://api.example.com
          VITE_API_BASE_URL: https://api.example.com
      - name: Container diagnostics
        if: failure()
        run: docker logs moodly-frontend-ci
      - name: Remove container
        if: always()
        run: docker rm -f moodly-frontend-ci || true
